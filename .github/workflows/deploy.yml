name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, feat/astro-reader-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          path: ./site
          node-version: 22
        env:
          SITE_URL: https://rigsutra.github.io
          SITE_BASE: /mangagrove
          PUBLIC_NOINDEX: "true"   # mirror only: keep Google on the main mangagrove.pages.dev site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
